name: LiteTerm

options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  LiteTermCore:
    type: framework
    platform: iOS
    sources:
      - Sources/LiteTermCore

  LiteTerm:
    type: application
    platform: iOS
    sources:
      - LiteTerm
    dependencies:
      - target: LiteTermCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liteterm.app
        GENERATE_INFOPLIST_FILE: YES

  LiteTermCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/LiteTermCoreTests
    dependencies:
      - target: LiteTermCore

  LiteTermUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LiteTermUITests
    dependencies:
      - target: LiteTerm
