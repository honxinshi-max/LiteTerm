name: LiteTerm

options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    revision: dd2fb8ac5b861e7bf617c872895e338f38165648

targets:
  LiteTermCore:
    type: framework
    platform: iOS
    sources:
      - Sources/LiteTermCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"

  LiteTerm:
    type: application
    platform: iOS
    sources:
      - LiteTerm
    dependencies:
      - target: LiteTermCore
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: LiteTerm/Resources/LiteTerm.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LiteTerm/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.liteterm.app
        TARGETED_DEVICE_FAMILY: "2"

  LiteTermCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/LiteTermCoreTests
    dependencies:
      - target: LiteTermCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"

  LiteTermUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LiteTermUITests
    dependencies:
      - target: LiteTerm
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
