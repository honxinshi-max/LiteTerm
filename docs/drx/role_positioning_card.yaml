schema: drx.role_positioning_card.v1
role: producer
product: LiteSpace
target_user: iPad user who needs a lightweight on-device edit, check, test, and preview loop while retaining the existing local file and SSH workflows
target_job: authorize a folder, edit one source file, run a bounded local workspace gate, understand failures, open a loopback preview only after readiness, and release all runtime resources on stop or background
value_trigger: the current source generation completes inspect, check, test, start, and health stages before one authenticated loopback port becomes visible within the physical-iPad resource budget
feedback_loop:
  observe:
    - runtime_kind
    - normalized_gate_state
    - normalized_failure_category
    - bounded_stage_duration
    - idle_web_python_rss
    - port_lease_outcome
    - acceptance_result
  prohibit:
    - source_code
    - file_content
    - filename
    - full_path
    - command_text
    - stdout
    - stderr
    - credential
    - network_destination
    - preview_secret
decision_boundary: Ready proves only the defined gate for one source generation; Swift does not compile locally, and physical-iPad resources, privacy archive, and App Store acceptance remain unproven until their named gates pass
